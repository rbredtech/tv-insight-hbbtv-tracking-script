name: Develop
on:
  push:
    branches:
      - "develop"
      - "feature/*"
      - "release/*"
      - "hotfix/*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup node 🟩
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@v7

      - name: Install dependencies 🚚
        id: install
        run: yarn install --frozen-lockfile

      - name: Lint 🧼
        id: lint
        run: yarn lint

      - name: Test un-minified 🧪
        id: test
        run: yarn ci

      - name: Minify 🗜️
        run: yarn minify

      - name: Test minified 🧪
        run: yarn ci
        env:
          USE_MINIFIED: true

  create-prerelease:
    name: Create pre-release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Setup node 🟩
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@v7

      - name: Install dependencies 🚚
        id: install
        run: yarn install --frozen-lockfile

      - name: Create snapshot tag 🏷️
        id: create-snapshot-tag
        run: |
          echo 'version=snapshot_${{ github.run_number }}' >> $GITHUB_OUTPUT

      - name: Set snapshot tag 🏷️
        id: set-snapshot-tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.create-snapshot-tag.outputs.version }}

      - name: Minify 🗜️
        run: yarn minify

      - name: Zip un-minified 📦
        run: zip -r -j templates.zip ./src/*

      - name: Zip minified 📦
        run: zip -r -j templates.min.zip ./dist/*

      - name: Create pre-release 🚀
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.create-snapshot-tag.outputs.version }}
          tag_name: ${{ steps.create-snapshot-tag.outputs.version }}
          files: |
            templates.zip
            templates.min.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
