name: Release
on:
  push:
    branches:
      - "!develop"
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup node 🟩
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@v7

      - name: Install dependencies 🚚
        id: install
        run: yarn install --frozen-lockfile

      - name: Lint 🧼
        id: lint
        run: yarn lint

      - name: Test un-minified 🧪
        id: test
        run: yarn ci

      - name: Minify 🗜️
        run: yarn minify

      - name: Test minified 🧪
        run: yarn ci
        env:
          USE_MINIFIED: true

  release:
    name: Create release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup node 🟩
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@v7

      - name: Install dependencies 🚚
        id: install
        run: yarn install --frozen-lockfile

      - name: Minify 🗜️
        run: yarn minify

      - name: Zip un-minified 📦
        run: zip -r -j templates.zip ./src/*

      - name: Zip minified 📦
        run: zip -r -j templates.min.zip ./dist/*

      - name: Create release 🚀
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            templates.zip
            templates.min.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
